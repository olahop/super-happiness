<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Thrift Window · Trondheim</title>
<!-- Pretty URL for the Trondheim demo: /trondheim/ → the app with ?city=trondheim.
     A redirect rather than a copy of the app, so it works on any static host
     (and from file://) without server-side rewrite rules. -->
<meta http-equiv="refresh" content="0; url=../index.html?city=trondheim">
<script>location.replace("../index.html?city=trondheim" + location.hash);</script>
</head>
<body>
<a href="../index.html?city=trondheim">Åpne Thrift Window i Trondheim</a>
</body>
</html>
